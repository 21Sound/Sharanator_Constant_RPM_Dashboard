<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VW Style CAN Dashboard</title>

<style>

#dashboard {
    display: flex;
    flex-direction: row;     /* nebeneinander */
    gap: 40px;
    justify-content: center;
    align-items: flex-start; /* Fader oben ausrichten */
    width: 100%;
}

#gauges {
    display: flex;
    flex-direction: column;  /* Gauges untereinander */
    gap: 0px;
}

#controls {
    display: flex;
    flex-direction: column;
    gap: 40px;
    margin-top: 20px;
    width: 250px;            /* Fader-Breite */
}

.fader {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.fader label {
    font-size: 18px;
    margin-bottom: 4px;
}

.fader input[type=range] {
    width: 100%;
}

.fader input[type=number] {
    width: 100%;
    padding: 6px;
    font-size: 16px;
    background: #222;
    color: white;
    border: 1px solid #555;
    border-radius: 4px;
}

body {
    background:#111;
    color:white;
    font-family:Arial;
    display:flex;
    flex-direction: column;   /* <— Gauges untereinander */
    align-items: center;      /* <— zentriert */
    gap:0px;
    padding-top:0px;
}
canvas {
    background:#111;
}
</style>
</head>
<body>

<div id="dashboard">
    <div id="gauges1">
        <!-- deine drei Canvas-Gauges -->
        <canvas id="gauge_pedal"></canvas>
        <canvas id="gauge_rpm"></canvas>
        <canvas id="gauge_kmph"></canvas>
    </div>

    <div id="gauges2">
        <!-- deine drei Canvas-Gauges -->
        <canvas id="gauge_power"></canvas>
        <canvas id="gauge_torque"></canvas>
        <canvas id="gauge_fuel"></canvas>
    </div>

    <div id="controls">
        <div class="fader">
            <label>Ziel-Drehzahl (RPM)</label>
            <input type="range" id="rpm_target" min="0" max="3000" step="10" value="1000">
            <input type="text" id="rpm_target_val" value="1000">
        </div>

        <div class="fader">
            <label>Fahrpedal (%)</label>
            <input type="range" id="pedal_input" min="0.0" max="100.0" step="1.0" value="0.0">
            <input type="text" id="pedal_input_val" value="0.0">
        </div>

        <div class="fader">
            <label>Tau Attack (s)</label>
            <input type="range" id="tau_att" min="0.0" max="1.0" step="0.01" value="0.1">
            <input type="text" id="tau_att_val" value="0.1">
        </div>

        <div class="fader">
            <label>Tau Release (s)</label>
            <input type="range" id="tau_rel" min="0.0" max="1.0" step="0.01" value="0.1">
            <input type="text" id="tau_rel_val" value="0.1">
        </div>

        <div class="fader">
            <label>Pedal Gain (NV)</label>
            <input type="range" id="pedal_gain" min="0.0" max="1.0" step="0.01" value="0.1">
            <input type="text" id="pedal_gain_val" value="0.1">
        </div>
    </div>
</div>

<script>
// ------------------------------------------------------------
// GENERISCHE GAUGE-FUNKTION (VW-Style, farbige Bereiche)
// ------------------------------------------------------------
function createGauge(canvasId, label, minValue, maxValue, majorTicks, minorTicks, colorZones) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext("2d");
    canvas.width = 200;
    canvas.height = 200;

    const CX = 100;
    const CY = 100;
    const R  = 95;

    const circStart = 0.85;
    const circEnd = 2.15;

    // 210° → 330° (im Uhrzeigersinn)
    function valueToAngle(v) {
        const start = circStart * Math.PI;   // 210°
        const end   = circEnd * Math.PI;   // 330°
        const frac = (v - minValue) / (maxValue - minValue);
        return start + frac * (end - start);
    }

    function drawBackground() {
        ctx.clearRect(0,0,300,300);

        // Hintergrund
        ctx.beginPath();
        ctx.arc(CX, CY, R, 0, 2*Math.PI);
        ctx.fillStyle = "#111";
        ctx.fill();

        // ------------------------------------------------------------
        // Farbige Bereiche (VW-Style)
        // ------------------------------------------------------------
        for (const zone of colorZones) {
            const a1 = valueToAngle(zone.from);
            const a2 = valueToAngle(zone.to);

            ctx.beginPath();
            ctx.strokeStyle = zone.color;
            ctx.lineWidth = 10;
            ctx.arc(CX, CY, R - 5, a1, a2);
            ctx.stroke();
        }

        // Skalenbogen
        ctx.strokeStyle = "#555";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(CX, CY, R, circStart*Math.PI, circEnd*Math.PI);
        ctx.stroke();

        // Große Ticks + Labels
        ctx.fillStyle = "white";
        ctx.font = "14px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const majorStep = (maxValue - minValue) / (majorTicks - 1);
        const minorStep = majorStep / (minorTicks + 1);

        for (let i = 0; i < majorTicks; i++) {
            const val = minValue + i * majorStep;
            const ang = valueToAngle(val);

            const x1 = CX + (R - 15) * Math.cos(ang);
            const y1 = CY + (R - 15) * Math.sin(ang);
            const x2 = CX + R * Math.cos(ang);
            const y2 = CY + R * Math.sin(ang);

            // großer Tick
            ctx.strokeStyle = "#ccc";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            // Label (dezimal falls nötig)
            const labelText =
                (maxValue <= 10 ? val.toFixed(1) : Math.round(val)).toString();

            const lx = CX + (R - 35) * Math.cos(ang);
            const ly = CY + (R - 35) * Math.sin(ang);
            ctx.fillText(labelText, lx, ly);

            // kleine Ticks
            if (i < majorTicks - 1) {
                for (let j = 1; j <= minorTicks; j++) {
                    const subVal = val + j * minorStep;
                    const subAng = valueToAngle(subVal);

                    const sx1 = CX + (R - 10) * Math.cos(subAng);
                    const sy1 = CY + (R - 10) * Math.sin(subAng);
                    const sx2 = CX + R * Math.cos(subAng);
                    const sy2 = CY + R * Math.sin(subAng);

                    ctx.strokeStyle = "#777";
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(sx1, sy1);
                    ctx.lineTo(sx2, sy2);
                    ctx.stroke();
                }
            }
        }

        // Gauge-Beschriftung
        ctx.fillStyle = "white";
        ctx.font = "20px Arial";
        ctx.fillText(label, CX, CY + 70);
    }

    drawBackground();

    return {
        draw: function(value) {
            drawBackground();

            const ang = valueToAngle(value);

            // Zeiger
            ctx.strokeStyle = "red";
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(CX, CY);
            ctx.lineTo(CX + (R-5)*Math.cos(ang), CY + (R-5)*Math.sin(ang));
            ctx.stroke();

            // Mittelpunkt
            ctx.beginPath();
            ctx.arc(CX, CY, 5, 0, 2*Math.PI);
            ctx.fillStyle = "black";
            ctx.fill();
        }
    };
}

function sweepGauge(gauge, min, max, duration = 1200) {
    const steps = 60;
    const upTime = duration / 2;
    const downTime = duration / 2;

    // Sweep up
    let start = null;
    function animateUp(ts) {
        if (!start) start = ts;
        const progress = (ts - start) / upTime;
        const value = min + (max - min) * Math.min(progress, 1);
        gauge.draw(value);

        if (progress < 1) {
            requestAnimationFrame(animateUp);
        } else {
            // Sweep down
            start = null;
            requestAnimationFrame(animateDown);
        }
    }

    function animateDown(ts) {
        if (!start) start = ts;
        const progress = (ts - start) / downTime;
        const value = max - (max - min) * Math.min(progress, 1);
        gauge.draw(value);

        if (progress < 1) {
            requestAnimationFrame(animateDown);
        }
    }

    requestAnimationFrame(animateUp);
}

function bindFader(rangeId, textId) {
    const range = document.getElementById(rangeId);
    const text = document.getElementById(textId);

    // Slider → Textfeld
    range.addEventListener("input", () => {
        text.value = range.value;
    });

    // Textfeld: Komma → Punkt während der Eingabe
    text.addEventListener("input", () => {
        text.value = text.value.replace(",", ".");
    });

    // Textfeld: erst bei Verlassen validieren
    text.addEventListener("change", () => {
        let raw = text.value;

        // Leere Eingabe → auf Sliderwert zurücksetzen
        if (raw.trim() === "") {
            text.value = range.value;
            return;
        }

        let num = parseFloat(raw);
        if (isNaN(num)) {
            // Ungültig → alten Wert wiederherstellen
            text.value = range.value;
            return;
        }

        // Min/Max vom Slider übernehmen
        const min = parseFloat(range.min);
        const max = parseFloat(range.max);

        if (num < min) num = min;
        if (num > max) num = max;

        // Slider aktualisieren
        range.value = num;

        // Textfeld sauber formatieren
        text.value = num;
    });
}

// Drei Fader verbinden
bindFader("rpm_target", "rpm_target_val");
bindFader("pedal_input", "pedal_input_val");
bindFader("tau_att", "tau_att_val");
bindFader("tau_rel", "tau_rel_val");
bindFader("pedal_gain", "pedal_gain_val");

// ------------------------------------------------------------
// GAUGES ERZEUGEN (VW-Style Farbzonen)
// ------------------------------------------------------------

// Pedal: Grün 0–60, Gelb 60–80, Rot 80–100
const pedalGauge = createGauge(
    "gauge_pedal", "Pedalstellung (%)",
    0, 100, 6, 4,
    [
        {from:0, to:80, color:"#0f0"},
        {from:80, to:90, color:"#ff0"},
        {from:90, to:100, color:"#f00"}
    ]
);

// RPM: Grün 0–3000, Gelb 3000–4000, Rot 4000–5000
const rpmGauge = createGauge(
    "gauge_rpm", "Drehzahl (U/min)",
    0, 5000, 6, 4,
    [
        {from:0, to:3500, color:"#0f0"},
        {from:3500, to:4000, color:"#ff0"},
        {from:4000, to:5000, color:"#f00"}
    ]
);

// Boost: Grün 0–1.2, Gelb 1.2–1.8, Rot 1.8–2.5
const kmphGauge = createGauge(
    "gauge_kmph", "Geschw. (km/h)",
    0, 200, 6, 4,
    [
        {from:0, to:160, color:"#0f0"},
        {from:160, to:180, color:"#ff0"},
        {from:180, to:200, color:"#f00"}
    ]
);

const powerGauge = createGauge(
    "gauge_power", "Motorlast (%)",
    0, 100, 6, 4,
    [
        {from:0, to:80, color:"#0f0"},
        {from:80, to:90, color:"#ff0"},
        {from:90, to:100, color:"#f00"}
    ]
);

const torqueGauge = createGauge(
    "gauge_torque", "Drehmoment (NM)",
    0, 400, 6, 4,
    [
        {from:0, to:300, color:"#0f0"},
        {from:300, to:350, color:"#ff0"},
        {from:350, to:400, color:"#f00"}
    ]
);

const fuelGauge = createGauge(
    "gauge_fuel", "Tank (%)",
    0, 100, 6, 4,
    [
        {from:0, to:10, color:"#f00"},
        {from:10, to:20, color:"#ff0"},
        {from:20, to:100, color:"#0f0"}
    ]
);

// ------------------------------------------------------------
// NULLSTELLUNG
// ------------------------------------------------------------
pedalGauge.draw(0);
rpmGauge.draw(0);
kmphGauge.draw(0);
powerGauge.draw(0);
torqueGauge.draw(0);
fuelGauge.draw(0);

// Needle Sweep beim Start
setTimeout(() => {
    sweepGauge(pedalGauge, 0, 100);
    sweepGauge(rpmGauge, 0, 5000);
    sweepGauge(kmphGauge, 0, 200);
    sweepGauge(powerGauge, 0, 100);
    sweepGauge(torqueGauge, 0, 400);
    sweepGauge(fuelGauge, 0, 100);
}, 500);


// ------------------------------------------------------------
// LIVE-DATEN (SSE)
// ------------------------------------------------------------
const evtSource = new EventSource("/stream");

evtSource.onmessage = function(event) {
    let data = JSON.parse(event.data);

    pedalGauge.draw(data.pedal);
    rpmGauge.draw(data.rpm);
    boostGauge.draw(data.boost);
};
</script>

</body>
</html>
